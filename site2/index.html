<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宏遠驗屋｜大樓社區公設點交</title><style>*{box-sizing:border-box}html,body{margin:0;background:#111;color:#fff;font-family:Arial,"Noto Sans TC",sans-serif}.page{position:relative;width:min(100%,1600px);margin:0 auto 2px;background:#fff;line-height:0}.page canvas{width:100%;height:auto;display:block}.loading{position:fixed;z-index:20;top:16px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:999px;font-size:14px}.loading.done{display:none}.video{position:absolute;inset:13% 8% 12%;display:flex;align-items:center;justify-content:center;line-height:1.5}.video iframe{width:100%;aspect-ratio:16/9;border:0;box-shadow:0 8px 30px #0006;background:#000}</style></head><body><div id="loading" class="loading">載入 36 頁簡報中…</div><main id="pages"></main><script type="module">import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const pdf=await pdfjsLib.getDocument('./site2.pdf').promise;const root=document.getElementById('pages');for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n);const viewport=page.getViewport({scale:2});const wrap=document.createElement('section');wrap.className='page';wrap.id='page-'+n;const canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;wrap.appendChild(canvas);if(n===33){const box=document.createElement('div');box.className='video';box.innerHTML='<iframe src="https://www.youtube.com/embed/VIDEO_ID" title="宏遠驗屋檢驗紀錄影片" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';wrap.appendChild(box)}root.appendChild(wrap);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;}document.getElementById('loading').classList.add('done');</script></body></html>
