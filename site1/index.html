<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宏遠驗屋｜初驗＋驗屋儀器</title><style>*{box-sizing:border-box}html,body{margin:0;background:#111;color:#fff;font-family:Arial,"Noto Sans TC",sans-serif}.page{width:min(100%,1600px);margin:0 auto 2px;background:#fff;line-height:0}.page canvas{width:100%;height:auto;display:block}.loading{position:fixed;z-index:10;top:16px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:999px;font-size:14px}.loading.done{display:none}</style></head><body><div id="loading" class="loading">載入 30 頁簡報中…</div><main id="pages"></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script><script type="module">import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const pdf=await pdfjsLib.getDocument('./site1.pdf').promise;const root=document.getElementById('pages');for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n);const viewport=page.getViewport({scale:2});const wrap=document.createElement('section');wrap.className='page';wrap.id='page-'+n;const canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;wrap.appendChild(canvas);root.appendChild(wrap);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;}document.getElementById('loading').classList.add('done');</script></body></html>
